name: Release provenance
run-name: Attest main.js for ${{ github.event.release.tag_name || inputs.tag }}

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag to rebuild and verify
        required: true
        type: string

permissions: {}

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

concurrency:
  group: release-provenance-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.compare.outputs.digest }}
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - name: Validate the release tag
        shell: bash
        run: |
          if ! [[ "$RELEASE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Expected an Obsidian release tag such as 1.0.0' >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Identify the source commit
        id: source
        run: |
          commit=$(git rev-parse HEAD)
          if [[ "$GITHUB_EVENT_NAME" == release && "$GITHUB_SHA" != "$commit" ]]; then
            echo 'The tag moved after publication' >&2
            exit 1
          fi
          jq -e --arg tag "$RELEASE_TAG" '.version == $tag' manifest.json
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Test and rebuild main.js
        run: |
          npm ci
          npm test
          rm -f -- main.js
          npm run build

      - name: Compare with the published main.js
        id: compare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$RELEASE_TAG" --json isDraft --repo "$GITHUB_REPOSITORY" | jq -e '.isDraft == false'
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern main.js --dir "$RUNNER_TEMP/release"
          cmp main.js "$RUNNER_TEMP/release/main.js"
          digest=$(sha256sum main.js | cut -d ' ' -f 1)
          echo "digest=sha256:$digest" >> "$GITHUB_OUTPUT"

  attest:
    needs: rebuild
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      # A manual rebuild runs the workflow at its own ref, which can be newer
      # than the release. Record both commits in the signed provenance.
      - name: Record the source tag for a manual rebuild
        if: github.event_name == 'workflow_dispatch'
        env:
          SOURCE_COMMIT: ${{ needs.rebuild.outputs.commit }}
        run: |
          jq -n '
            (env.GITHUB_SERVER_URL + "/" + env.GITHUB_REPOSITORY) as $repo |
            {
              buildDefinition: {
                buildType: "https://actions.github.io/buildtypes/workflow/v1",
                externalParameters: {workflow: {
                  ref: env.GITHUB_REF, repository: $repo,
                  path: (env.GITHUB_WORKFLOW_REF | ltrimstr(env.GITHUB_REPOSITORY + "/") | rtrimstr("@" + env.GITHUB_REF))
                }},
                internalParameters: {github: {
                  event_name: env.GITHUB_EVENT_NAME, repository_id: env.GITHUB_REPOSITORY_ID,
                  repository_owner_id: env.GITHUB_REPOSITORY_OWNER_ID, runner_environment: env.RUNNER_ENVIRONMENT
                }},
                resolvedDependencies: [
                  {uri: ("git+" + $repo + "@" + env.GITHUB_REF), digest: {gitCommit: env.GITHUB_WORKFLOW_SHA}},
                  {uri: ("git+" + $repo + "@refs/tags/" + env.RELEASE_TAG), digest: {gitCommit: env.SOURCE_COMMIT}}
                ] | unique
              },
              runDetails: {
                builder: {id: (env.GITHUB_SERVER_URL + "/" + env.GITHUB_WORKFLOW_REF)},
                metadata: {invocationId: ($repo + "/actions/runs/" + env.GITHUB_RUN_ID + "/attempts/" + env.GITHUB_RUN_ATTEMPT)}
              }
            }' > "$RUNNER_TEMP/provenance.json"

      - name: Sign and publish build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: main.js
          subject-digest: ${{ needs.rebuild.outputs.digest }}
          predicate-type: ${{ github.event_name == 'workflow_dispatch' && 'https://slsa.dev/provenance/v1' || '' }}
          predicate-path: ${{ github.event_name == 'workflow_dispatch' && format('{0}/provenance.json', runner.temp) || '' }}
